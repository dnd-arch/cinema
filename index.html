<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Cinema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#120405;
    --panel:rgba(42,8,10,.76);
    --panel-2:rgba(109,16,21,.72);
    --line:rgba(255,72,72,.34);
    --text:#fff2f2;
    --text-dim:#e5a4a4;
    --red:#e52c35;
    --red-bright:#ff4a4f;
    --red-deep:#86141b;
    --red-glow:rgba(229,44,53,.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; min-height:100%;
    background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    background:#120405;
  }

  .brand{
    position:fixed; top:18px; left:22px; z-index:5;
    font-family:'Fraunces',serif; font-style:italic; font-weight:400;
    font-size:16px; letter-spacing:.02em; color:var(--text-dim);
    user-select:none; pointer-events:none;
    text-shadow:0 2px 18px rgba(0,0,0,.8);
  }
  .brand b{ color:var(--text); font-style:normal; font-weight:500; }

  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    padding:clamp(8px, 3vw, 28px);
    background:#120405;
  }
  .cinemaFrame{
    position:relative; z-index:1;
    width:min(100%, calc((100vh - 16px) * 1.7827));
    max-height:calc(100vh - 16px);
    line-height:0;
  }
  .hallImg{
    position:relative; width:100%; height:auto; display:block;
    pointer-events:none; user-select:none;
    filter:drop-shadow(0 30px 70px rgba(0,0,0,.72));
  }
  .screen{
    position:absolute;
    left:24.84%; top:27.58%; width:48.28%; height:37.33%;
    background:#000; overflow:visible;
    box-shadow:0 0 50px -6px var(--red-glow), inset 0 0 0 1px rgba(255,255,255,.08);
    transition:box-shadow .6s ease;
  }
  .screen.empty{ display:flex; align-items:center; justify-content:center; background:radial-gradient(ellipse at center,#241012 0%,#050203 100%); }
  .screen:fullscreen{ width:100vw; height:100vh; left:0; top:0; background:#000; overflow:visible; }
  .screen:fullscreen .chat-panel{ position:fixed !important; right:auto !important; bottom:auto !important; }
  .screen:fullscreen .fullscreen-btn{ top:18px; }
  .screen:fullscreen .fullscreen-chat-btn{ display:flex; }
  .fullscreen-btn{ position:absolute; right:10px; top:10px; z-index:30; border:1px solid rgba(255,255,255,.35); border-radius:8px; background:rgba(90,0,10,.82); color:#fff; padding:7px 9px; cursor:pointer; font-size:14px; }
  video{ max-width:100%; }
  video::-webkit-media-controls-fullscreen-button{ display:none; }
  .fullscreen-btn:hover{ background:var(--red); }
  .delete-video-btn{ position:absolute; right:52px; top:10px; z-index:30; border:1px solid rgba(255,150,150,.35); border-radius:8px; background:rgba(90,0,10,.82); color:#fff; padding:7px 9px; cursor:pointer; font-size:14px; }
  .delete-video-btn:hover{ background:var(--red); }
  .fullscreen-chat-btn{ display:none; position:absolute; right:94px; top:10px; z-index:35; border:1px solid rgba(255,150,150,.35); border-radius:8px; background:rgba(90,0,10,.88); color:#fff; padding:7px 9px; cursor:pointer; font-size:14px; }
  .fullscreen-chat-btn:hover{ background:var(--red); }
  .empty-hint{ text-align:center; color:var(--text-dim); font-size:clamp(9px,1.35vw,13px); letter-spacing:.01em; max-width:82%; line-height:1.5; }
  .empty-hint .glyph{ font-family:'Fraunces',serif; font-style:italic; font-size:clamp(13px,2.3vw,21px); color:var(--text); display:block; margin-bottom:5px; }
  video, iframe{ width:100%; height:100%; display:block; border:0; background:#000; }

  .tray{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
    z-index:6; display:flex; align-items:center; gap:7px;
    background:rgba(55,7,10,.74); backdrop-filter:blur(14px);
    border:1px solid var(--line); padding:7px; border-radius:999px;
    box-shadow:0 8px 30px rgba(0,0,0,.35), 0 0 22px rgba(155,17,24,.18);
    opacity:.82; transition:opacity .25s ease, transform .25s ease;
  }
  .tray:hover,.tray:focus-within{ opacity:1; }
  .tray input[type=text]{ background:rgba(0,0,0,.16); border:0; outline:0; color:var(--text); font-family:'Inter',sans-serif; font-size:12.5px; width:180px; padding:7px 8px; border-radius:999px; }
  .tray input[type=text]::placeholder{ color:#d69494; }
  .tray button,.tray label{
    display:flex; align-items:center; justify-content:center; gap:5px;
    background:linear-gradient(145deg,var(--red-bright),var(--red-deep)); border:1px solid rgba(255,150,150,.3);
    color:#fff; border-radius:999px; min-width:34px; height:34px; padding:0 11px; cursor:pointer;
    font-size:12px; font-weight:600; transition:.15s ease; box-shadow:0 4px 14px rgba(128,10,16,.3);
  }
  .tray button:hover,.tray label:hover{ transform:translateY(-1px); filter:brightness(1.12); }
  .tray .divider{ width:1px; height:18px; background:var(--line); margin:0 2px; }
  .tray input[type=file]{ display:none; }
  .upload-status{ color:#ffd0d0; font-size:10px; white-space:nowrap; padding:0 4px; }
  .transfer-progress{ position:fixed; left:50%; bottom:72px; transform:translateX(-50%); z-index:12; width:min(380px,calc(100vw - 24px)); padding:11px 13px; border:1px solid var(--line); border-radius:13px; background:rgba(35,5,8,.94); backdrop-filter:blur(16px); box-shadow:0 10px 35px rgba(0,0,0,.48); color:#fff; font-size:11px; }
  .transfer-progress.hidden{ display:none; }
  .transfer-title{ display:flex; justify-content:space-between; gap:8px; margin-bottom:7px; }
  .transfer-bar{ height:8px; overflow:hidden; border-radius:99px; background:rgba(255,255,255,.13); }
  .transfer-fill{ height:100%; width:0%; border-radius:inherit; background:linear-gradient(90deg,var(--red-deep),var(--red-bright)); transition:width .15s linear; }
  .transfer-detail{ margin-top:7px; color:#f3baba; text-align:center; }
  @media(max-width:640px){ .transfer-progress{ bottom:82px; font-size:11px; } }
  body.viewer-mode .tray label{ display:none; }
  .account-gate{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; background:rgba(12,2,4,.82); backdrop-filter:blur(12px); }
  .account-gate.hidden{ display:none; }
  .account-card{ width:min(340px,calc(100vw - 32px)); padding:26px; border:1px solid var(--line); border-radius:18px; background:rgba(48,7,10,.94); text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.55); }
  .account-card h2{ margin:0 0 8px; font-family:'Fraunces',serif; font-weight:400; }
  .account-card p{ margin:0 0 20px; color:var(--text-dim); font-size:12px; }
  .account-actions{ display:flex; gap:10px; }
  .account-actions button{ flex:1; border:1px solid rgba(255,150,150,.35); border-radius:12px; padding:12px 8px; color:#fff; background:linear-gradient(145deg,var(--red-bright),var(--red-deep)); cursor:pointer; font-weight:600; }
  .account-actions button:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  body.viewer-mode .tray label[for="fileInput"], body.viewer-mode #fileInput{ display:none; }

  .chat-fab{
    position:fixed; bottom:24px; right:24px; z-index:20;
    width:54px; height:54px; border-radius:50%;
    background:linear-gradient(145deg,var(--red-bright),var(--red-deep));
    border:1px solid rgba(255,154,154,.45); display:flex; align-items:center; justify-content:center;
    cursor:grab; color:#fff; touch-action:none; user-select:none;
    box-shadow:0 10px 28px -8px rgba(0,0,0,.75), 0 0 0 1px var(--line), 0 0 26px rgba(203,24,31,.3);
    transition:box-shadow .2s ease, filter .2s ease;
  }
  .chat-fab:active{ cursor:grabbing; }
  .chat-fab:hover{ filter:brightness(1.1); box-shadow:0 12px 32px -8px rgba(0,0,0,.8),0 0 30px rgba(229,44,53,.45); }
  .chat-fab.hidden{ display:none; }
  .chat-fab svg{ width:21px; height:21px; }
  .chat-fab .dot{ position:absolute; top:6px; right:6px; width:8px; height:8px; border-radius:50%; background:#ffd0d0; box-shadow:0 0 8px #fff; display:none; }
  .chat-fab .dot.show{ display:block; }
  .unread-count{ position:absolute; top:-5px; right:-5px; min-width:21px; height:21px; padding:0 5px; border-radius:99px; display:none; place-items:center; background:#fff; color:#a20d16; font-size:11px; font-weight:800; border:2px solid #a20d16; }
  .unread-count.show{ display:grid; }
  .typing-indicator{ min-height:18px; padding:0 14px; color:#f3a5a5; font-size:11px; font-style:italic; }
  .reply-bar{ display:none; align-items:center; gap:8px; padding:7px 10px; border-top:1px solid var(--line); color:#ffcaca; font-size:11px; }
  .reply-bar.show{ display:flex; }
  .reply-bar span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .reply-cancel{ border:0; background:transparent; color:#fff; cursor:pointer; font-size:16px; }
  .msg{ cursor:pointer; }
  .msg-reply{ display:block; margin-bottom:5px; padding:4px 7px; border-right:2px solid #ff8585; color:#ffd0d0; background:rgba(0,0,0,.18); border-radius:5px; font-size:10px; }
  .msg-reply b{ display:block; font-size:9px; margin-bottom:2px; }
  .typing-dots{ letter-spacing:2px; }

  .chat-panel{
    position:fixed; right:auto; bottom:auto; width:240px; height:230px;
    background:rgba(35,5,8,.94); backdrop-filter:blur(18px); border:1px solid var(--line); border-radius:14px;
    z-index:1000; display:flex; flex-direction:column; transform:scale(.94) translateY(10px); opacity:0; pointer-events:none;
    transition:transform .22s ease,opacity .22s ease; box-shadow:0 10px 35px rgba(0,0,0,.5);
  }
  .chat-panel.open{ transform:scale(1) translateY(0); opacity:1; pointer-events:auto; }
  .chat-head{ padding:12px 14px 10px 18px; touch-action:none; cursor:grab; border-bottom:1px solid var(--line); font-family:'Fraunces',serif; font-style:italic; font-size:17px; display:flex; align-items:center; justify-content:space-between; }
  .chat-head-info{ display:flex; flex-direction:column; gap:2px; pointer-events:none; }
  .chat-head:active{ cursor:grabbing; }
  .chat-status{ font-family:'Inter',sans-serif; font-style:normal; font-size:10px; color:#f4b6b6; }
  .chat-head-actions{ display:flex; align-items:center; gap:5px; }
  .chat-tool{ border:0; background:transparent; color:#ffdede; cursor:pointer; font-size:15px; padding:4px; }
  .chat-tool:hover{ color:#fff; }
  .emoji-picker{ display:none; position:absolute; bottom:58px; right:10px; width:190px; padding:9px; grid-template-columns:repeat(6,1fr); gap:5px; background:rgba(35,5,8,.98); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.5); }
  .emoji-picker.open{ display:grid; }
  .emoji-choice{ border:0; background:rgba(255,255,255,.06); color:#fff; border-radius:7px; padding:6px 2px; font-size:20px; cursor:pointer; }
  .emoji-choice:hover{ background:rgba(229,44,53,.45); }
  .msg-status{ display:block; margin-top:4px; font-size:9px; opacity:.78; text-align:right; }
  .msg-time{ display:block; margin-top:3px; font-size:9px; opacity:.6; text-align:right; }
  .msg-status.read{ color:#ffd1d1; }
  .chat-close{ width:32px; height:32px; display:grid; place-items:center; border:1px solid var(--line); border-radius:50%; background:rgba(229,44,53,.22); color:#fff; font-size:20px; line-height:1; cursor:pointer; }
  .chat-close:hover{ background:var(--red); }
  .chat-body{ flex:1; overflow-y:auto; padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .msg{ max-width:80%; padding:8px 12px; border-radius:14px; font-size:13.5px; line-height:1.45; word-wrap:break-word; }
  .msg-name{ display:block; margin-bottom:3px; font-size:10px; font-weight:600; opacity:.82; }
  .msg.amado{ align-self:flex-end; background:linear-gradient(145deg,#e52c35,#8f0b14); color:#fff; border-bottom-right-radius:4px; border:1px solid rgba(255,150,150,.35); }
  .msg.ekramo{ align-self:flex-start; background:linear-gradient(145deg,#40202b,#24121a); color:#ffe8e8; border:1px solid rgba(255,190,190,.28); border-bottom-left-radius:4px; }
  .chat-foot{ padding:12px; border-top:1px solid var(--line); display:flex; gap:8px; }
  .chat-foot input{ flex:1; background:rgba(0,0,0,.2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:10px; font-family:'Inter',sans-serif; font-size:13.5px; outline:0; }
  .chat-foot input:focus{ border-color:rgba(255,120,120,.7); }
  .chat-foot button{ background:var(--red); border:1px solid rgba(255,150,150,.3); color:#fff; width:38px; border-radius:10px; cursor:pointer; }

  .presence{ position:fixed; top:15px; right:22px; z-index:10; display:flex; gap:12px; align-items:center; direction:rtl; }
  .presence-user{ display:flex; align-items:center; gap:5px; color:#eab4b4; font-size:11px; white-space:nowrap; }
  .presence .who{ width:10px; height:10px; border-radius:50%; opacity:.35; background:#777; transition:.2s ease; }
  .presence .who.on{ opacity:1; box-shadow:0 0 9px currentColor; }
  .presence .who.on{ opacity:1; box-shadow:0 0 8px currentColor; }
  .presence .pink{ background:var(--red-bright); color:var(--red-bright); }
  .presence .blue{ background:#ffaaa8; color:#ffaaa8; }

  @media (max-width: 640px){
    .stage{ align-items:flex-start; padding:52px 8px 86px; overflow:auto; }
    .cinemaFrame{ width:100%; max-height:none; }
    .brand{ top:12px; left:14px; font-size:14px; }
    .presence{ top:15px; right:14px; }
    .tray{ bottom:max(10px, env(safe-area-inset-bottom)); max-width:calc(100vw - 16px); width:calc(100vw - 16px); justify-content:center; gap:4px; }
    .tray input[type=text]{ width:clamp(80px, 30vw, 150px); min-width:0; }
    .tray button,.tray label{ padding:0 8px; min-width:32px; font-size:11px; }
    .chat-fab{ right:14px; bottom:76px; width:50px; height:50px; }
    .chat-panel{ width:calc(100vw - 24px); height:min(55vh,420px); }
    .msg{ max-width:88%; font-size:15px; }
    .msg-name{ font-size:11px; }
    .chat-head{ padding-top:max(14px, env(safe-area-inset-top)); }
    .chat-foot{ padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  }
  @media (min-width: 1200px){
    .cinemaFrame{ width:min(92vw, calc((100vh - 28px) * 1.7827)); }
  }
</style>
</head>
<body>
  <div class="account-gate" id="accountGate">
    <div class="account-card">
      <h2>Our Cinema</h2>
      <p>اختر حسابك للدخول</p>
      <div class="account-actions">
        <button type="button" data-account="amado" onclick="chooseCinemaAccount('amado')">عمادو</button>
        <button type="button" data-account="ekramo" onclick="chooseCinemaAccount('ekramo')">إكرامو</button>
      </div>
    </div>
  </div>

  <div class="brand"><b>Our</b> Cinema</div>
  <div class="transfer-progress hidden" id="transferProgress">
    <div class="transfer-title"><span id="transferTitle">نقل الفيديو</span><b id="transferPercent">0%</b></div>
    <div class="transfer-bar"><div class="transfer-fill" id="transferFill"></div></div>
    <div class="transfer-detail" id="transferDetail">جاري التحضير…</div>
  </div>
  <div class="presence">
    <span class="presence-user"><span class="who pink" id="presPink"></span>عمادو</span>
    <span class="presence-user"><span class="who blue" id="presBlue"></span>إكرامو</span>
  </div>

function clearScreen(){

function showEmpty(){

function toEmbedUrl(url){
  try{
    const u = new URL(url);
    if(u.hostname === "t.me" || u.hostname === "telegram.me"){
      const parts=u.pathname.split("/").filter(Boolean);
      if(parts.length >= 2 && /^\d+$/.test(parts[1])) return "https://t.me/"+parts[0]+"/"+parts[1]+"?embed=1";
    }
    if(u.hostname.includes("youtube.com") || u.hostname === "youtu.be"){
      let id = u.searchParams.get("v");
      if(u.hostname === "youtu.be") id = u.pathname.slice(1);
      if(id) return "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(id) + "?enablejsapi=1&playsinline=1&rel=0";
    }
    if(u.hostname.includes("vimeo.com")){
      const id = u.pathname.split("/").filter(Boolean).pop();
      if(id) return "https://player.vimeo.com/video/" + id;
    }
  }catch(e){}
  return null;
}

function isDirectVideo(url){
  return /\.(mp4|webm|mkv|mov|m4v)(?:[?#].*)?$/i.test(url) || /(^|[?&])(video|download)=/i.test(url);
}

function loadVideoSrc(src, broadcast){
  clearScreen();
  mediaType = "video";
  const v = document.createElement("video");
  v.src = src; v.controls = true; v.autoplay = false; v.playsInline = true;
  screenEl.appendChild(v);
  mediaEl = v;
  bindVideoEvents(v);
  if(broadcast) pushState({type:"video", url: (src.startsWith("blob:") ? "" : src), playing:false, time:0});
}

function loadEmbed(embedUrl, broadcast){
  clearScreen();
  mediaType = "embed";
  const f = document.createElement("iframe");
  f.src = embedUrl;
  f.title = "Our Cinema video";
  f.referrerPolicy = "strict-origin-when-cross-origin";
  f.allow = "autoplay; fullscreen; picture-in-picture; encrypted-media";
  f.allowFullscreen = true;
  screenEl.appendChild(f);
  mediaEl = f;
  if(broadcast) pushState({type:"embed", url: embedUrl, playing:false, time:0});
}

function bindVideoEvents(v){
  // التشغيل محلي في كل جهاز، ولا تتم مزامنته حسب طلبك.
}

function pushState(partial){
  if(!connected) return;
  const now = Date.now();
  lastSentAt = now;
  roomRef.child("state").update(Object.assign({
    updatedBy: sessionId, updatedAt: now
  }, partial));
}

// ---------- Remote listener ----------
if(connected){
  roomRef.child("state").on("value", snap=>{
    const s = snap.val();
    if(!s || s.updatedBy === sessionId) return;

    applyingRemote = true;

    if(s.type === "clear"){ showEmpty(); }
    if(s.type === "video" && s.url){
      if(!(mediaType === "video" && mediaEl && mediaEl.src === s.url)){
        loadVideoSrc(s.url, false);
      }
    } else if(s.type === "embed" && s.url){
      if(!(mediaType === "embed" && mediaEl && mediaEl.src === s.url)){
        loadEmbed(s.url, false);
      }
    }



    setTimeout(()=>{ applyingRemote = false; }, 250);
  });
}

// ---------- Direct peer-to-peer video transfer (no Storage, no subscription) ----------
let peer = null;
let transferChannel = null;
let receiveParts = [];
let receiveBytes = 0;
let receiveMeta = null;
let iceQueue = [];

function makePeer(){
  const pc = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  pc.onicecandidate = e=>{ if(e.candidate && connected) roomRef.child("webrtc/candidates/" + ACCOUNT_NAME).push(e.candidate.toJSON()); };
  pc.onconnectionstatechange = ()=>{ console.log("WebRTC:", pc.connectionState); if(pc.connectionState === "failed") transferStatus("فشل الاتصال، أعد اختيار الفيديو"); };
  return pc;
}
function formatBytes(bytes){
  if(!Number.isFinite(bytes) || bytes < 1024) return Math.max(0,Math.round(bytes||0))+" B";
  const units=["KB","MB","GB"]; let n=bytes/1024, i=0;
  while(n>=1024 && i<units.length-1){ n/=1024; i++; }
  return n.toFixed(n>=100?0:n>=10?1:2)+" "+units[i];
}
function formatDuration(seconds){
  if(!Number.isFinite(seconds) || seconds<0) return "حساب الوقت…";
  seconds=Math.ceil(seconds); const m=Math.floor(seconds/60), s=seconds%60;
  return m ? m+" د "+String(s).padStart(2,"0")+" ث" : s+" ث";
}
function updateTransferProgress(kind, done, total, startedAt){
  const box=document.getElementById("transferProgress"), fill=document.getElementById("transferFill");
  const percent=total ? Math.min(100,done/total*100) : 0;
  const elapsed=Math.max(.1,(Date.now()-startedAt)/1000), speed=done/elapsed, remain=speed ? (total-done)/speed : Infinity;
  document.getElementById("transferTitle").textContent=kind === "send" ? "إرسال الفيديو" : "استقبال الفيديو";
  document.getElementById("transferPercent").textContent=Math.round(percent)+"%";
  fill.style.width=percent+"%";
  document.getElementById("transferDetail").textContent=formatBytes(done)+" / "+formatBytes(total)+" • "+formatBytes(speed)+"/ث • المتبقي "+formatDuration(remain);
  box.classList.remove("hidden");
}
function finishTransferProgress(text){
  document.getElementById("transferTitle").textContent=text;
  document.getElementById("transferPercent").textContent="100%";
  document.getElementById("transferFill").style.width="100%";
  document.getElementById("transferDetail").textContent="اكتمل النقل";
  setTimeout(()=>document.getElementById("transferProgress").classList.add("hidden"),2200);
}
function transferStatus(text){
  let el=document.querySelector(".upload-status");
  if(!el){ el=document.createElement("span"); el.className="upload-status"; document.querySelector(".tray").appendChild(el); }
  el.textContent=text; return el;
}
function sendVideoFile(file){
  if(!CAN_UPLOAD) return;
  if(!connected){ alert("Firebase غير متصل للإشارة بين الجهازين."); return; }
  if(peer) peer.close();
  peer=makePeer();
  transferChannel=peer.createDataChannel("video",{ordered:true});
  transferChannel.bufferedAmountLowThreshold=1024*1024;
  transferChannel.onopen=async ()=>{
    transferChannel.send(JSON.stringify({kind:"meta",name:file.name,size:file.size,type:file.type||"video/mp4"}));
    const chunk=64*1024; let offset=0; const startedAt=Date.now(); const status=transferStatus("إرسال 0%");
    updateTransferProgress("send",0,file.size,startedAt);
    while(offset<file.size){
      if(transferChannel.bufferedAmount>8*1024*1024) await new Promise(r=>{ transferChannel.onbufferedamountlow=r; });
      const buf=await file.slice(offset,offset+chunk).arrayBuffer();
      transferChannel.send(buf); offset+=buf.byteLength;
      status.textContent="إرسال "+Math.round(offset/file.size*100)+"%";
      updateTransferProgress("send",offset,file.size,startedAt);
    }
    transferChannel.send(JSON.stringify({kind:"done"}));
    status.textContent="تم النقل"; finishTransferProgress("تم إرسال الفيديو"); setTimeout(()=>status.remove(),1800);
  };
  roomRef.child("webrtc/candidates/" + ACCOUNT_NAME).remove()
    .then(()=>roomRef.child("webrtc/answer").remove())
    .then(()=>peer.createOffer())
    .then(o=>peer.setLocalDescription(o))
    .then(()=>roomRef.child("webrtc/offer").set({from:ACCOUNT_NAME,sdp:peer.localDescription.toJSON(),at:Date.now()}))
    .catch(err=>{ console.error("WebRTC offer failed",err); transferStatus("فشل بدء الإرسال"); });
}
function prepareReceiver(){
  if(CAN_UPLOAD || !connected) return;
  if(peer) peer.close(); peer=makePeer();
  peer.ondatachannel=e=>{
    transferChannel=e.channel;
    transferChannel.binaryType="arraybuffer";
    transferChannel.onmessage=ev=>{
      if(typeof ev.data === "string"){
        const msg=JSON.parse(ev.data);
        if(msg.kind==="meta"){ receiveMeta=msg; receiveParts=[]; receiveBytes=0; receiveMeta.startedAt=Date.now(); transferStatus("استقبال 0%"); updateTransferProgress("receive",0,msg.size,receiveMeta.startedAt); }
        if(msg.kind==="done"){
          const blob=new Blob(receiveParts,{type:receiveMeta.type||"video/mp4"});
          const url=URL.createObjectURL(blob); loadVideoSrc(url,false); pushState({type:"video",url:"",playing:false,time:0});
          finishTransferProgress("تم استقبال الفيديو"); const status=document.querySelector(".upload-status"); if(status){status.textContent="تم الاستقبال";setTimeout(()=>status.remove(),1800);}
        }
      } else if(receiveMeta){
        receiveParts.push(ev.data); receiveBytes+=ev.data.byteLength;
        const status=transferStatus("استقبال "+Math.round(receiveBytes/receiveMeta.size*100)+"%");
        updateTransferProgress("receive",receiveBytes,receiveMeta.size,receiveMeta.startedAt);
      }
    };
  };
}
if(connected){
  if(!CAN_UPLOAD) prepareReceiver();
  roomRef.child("webrtc/offer").on("value",async snap=>{
    const offer=snap.val(); if(CAN_UPLOAD || !offer || offer.from===ACCOUNT_NAME) return;
    prepareReceiver();
    iceQueue=[];
    await peer.setRemoteDescription(new RTCSessionDescription(offer.sdp));
    for(const c of iceQueue.splice(0)) try{ await peer.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
    const answer=await peer.createAnswer(); await peer.setLocalDescription(answer);
    await roomRef.child("webrtc/answer").set({from:ACCOUNT_NAME,sdp:peer.localDescription.toJSON()});
  });
  roomRef.child("webrtc/answer").on("value",async snap=>{
    const answer=snap.val(); if(!CAN_UPLOAD || !answer || !peer || answer.from===ACCOUNT_NAME || peer.currentRemoteDescription || peer.signalingState !== "have-local-offer") return;
    await peer.setRemoteDescription(new RTCSessionDescription(answer.sdp));
    for(const c of iceQueue.splice(0)) try{ await peer.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
  });
  const remoteAccount = CAN_UPLOAD ? "ekramo" : "amado";
  roomRef.child("webrtc/candidates/" + remoteAccount).on("child_added",async snap=>{
    const c=snap.val(); if(!c || !peer) return;
    if(!peer.remoteDescription){ iceQueue.push(c); return; }
    try{ await peer.addIceCandidate(new RTCIceCandidate(c)); }catch(e){}
  });
}


function handleUrlSubmit(){
  const input = document.getElementById("urlInput");
  const raw = input.value.trim();
  if(!raw) return;
  const embed = toEmbedUrl(raw);
  if(embed){ loadEmbed(embed, true); }
  else if(isDirectVideo(raw)){ loadVideoSrc(raw, true); }
  else { loadEmbed(raw, true); } // best-effort: try to display the page/video in an iframe
  input.value = "";
}

let audioCtx=null;
function unlockSound(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
let soundMuted=localStorage.getItem("ourcinema_mute") === "1";
function playMessageTone(){
  if(soundMuted) return;
  try{ unlockSound(); if(!audioCtx) return;
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type="sine"; o.frequency.setValueAtTime(740,audioCtx.currentTime);
    g.gain.setValueAtTime(.0001,audioCtx.currentTime); g.gain.linearRampToValueAtTime(.14,audioCtx.currentTime+.03); g.gain.linearRampToValueAtTime(.0001,audioCtx.currentTime+.96);
    o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+1.01);
  }catch(e){ console.warn("notification sound blocked",e); }
}
document.addEventListener('pointerdown',unlockSound,{once:true});

// ---------- Chat ----------
const chatFab = document.getElementById("chatFab");
const chatDot = document.getElementById("chatDot");
let chatOpen = false;

let fabDragging = false;
let fabMoved = false;
let fabPointer = null;
let fabStart = {x:0, y:0, left:0, top:0};

function placeChatNearFab(fabRect){
  const panelW=Math.min(320, window.innerWidth-24);
  const panelH=Math.min(360, Math.max(260, window.innerHeight*.55));
  let left=fabRect.left;
  let top=fabRect.top;
  if(left+panelW > window.innerWidth-8) left=window.innerWidth-panelW-8;
  if(top+panelH > window.innerHeight-8) top=window.innerHeight-panelH-8;
  left=Math.max(8,left); top=Math.max(8,top);
  chatPanel.style.position="fixed";
  chatPanel.style.width=panelW+"px";
  chatPanel.style.height=panelH+"px";
  chatPanel.style.left=left+"px";
  chatPanel.style.top=top+"px";
  chatPanel.style.right="auto";
  chatPanel.style.bottom="auto";
}
function setChatOpen(open){
  unlockSound();
  const fabRect = chatFab.getBoundingClientRect();
  chatOpen = open;
  chatPanel.classList.toggle("open", open);
  if(open){
    placeChatNearFab(fabRect);
    chatFab.classList.add("hidden");
    setUnread(0);
    setTimeout(()=>{ markOpenMessagesRead(); document.getElementById("chatInput").focus(); }, 180);
  }else{
    chatFab.classList.remove("hidden");
  }
}

function beginFabPointer(e){
  if(chatOpen) return;
  fabDragging = true; fabMoved = false; fabPointer = e.pointerId;
  const r = chatFab.getBoundingClientRect();
  fabStart = {x:e.clientX, y:e.clientY, left:r.left, top:r.top};
  if(chatFab.setPointerCapture) chatFab.setPointerCapture(e.pointerId);
}
function moveFabPointer(e){
  if(!fabDragging || e.pointerId !== fabPointer) return;
  const dx = e.clientX - fabStart.x, dy = e.clientY - fabStart.y;
  if(Math.hypot(dx,dy) > 7) fabMoved = true;
  if(!fabMoved) return;
  const maxX = Math.max(8, window.innerWidth - chatFab.offsetWidth - 8);
  const maxY = Math.max(8, window.innerHeight - chatFab.offsetHeight - 8);
  chatFab.style.left = Math.max(8, Math.min(maxX, fabStart.left + dx)) + "px";
  chatFab.style.top = Math.max(8, Math.min(maxY, fabStart.top + dy)) + "px";
  chatFab.style.right = "auto"; chatFab.style.bottom = "auto";
}
function endFabPointer(e){
  if(!fabDragging || (e.pointerId !== undefined && e.pointerId !== fabPointer)) return;
  fabDragging = false;
  if(!fabMoved) setChatOpen(true);
}
chatFab.addEventListener("pointerdown", beginFabPointer);
chatFab.addEventListener("pointermove", moveFabPointer);
chatFab.addEventListener("pointerup", endFabPointer);
chatFab.addEventListener("pointercancel", endFabPointer);
chatFab.addEventListener("click", e=>{ if(!fabMoved) setChatOpen(true); fabMoved = false; });
document.getElementById("chatClose").addEventListener("click", ()=>setChatOpen(false));
let chatDragging=false, chatDragStart=null;
const chatHead=document.querySelector("#chatPanel .chat-head");
chatHead.addEventListener("pointerdown", e=>{
  if(e.target.closest("#chatClose") || e.target.closest("button")) return;
  chatDragging=true; chatDragStart={x:e.clientX,y:e.clientY,left:chatPanel.offsetLeft,top:chatPanel.offsetTop};
  chatHead.setPointerCapture?.(e.pointerId); e.preventDefault();
});
function moveChatPanel(e){
  if(!chatDragging) return;
  const left=Math.max(8,Math.min(window.innerWidth-chatPanel.offsetWidth-8,chatDragStart.left+e.clientX-chatDragStart.x));
  const top=Math.max(8,Math.min(window.innerHeight-chatPanel.offsetHeight-8,chatDragStart.top+e.clientY-chatDragStart.y));
  chatPanel.style.left=left+"px"; chatPanel.style.top=top+"px";
}
function stopChatDrag(){chatDragging=false;}
chatHead.addEventListener("pointermove",moveChatPanel);
document.addEventListener("pointermove",moveChatPanel,{passive:false});
chatHead.addEventListener("pointerup",stopChatDrag);
chatHead.addEventListener("pointercancel",stopChatDrag);
window.addEventListener("pointerup",stopChatDrag);

const chatBody=document.getElementById("chatBody"), unreadCountEl=document.getElementById("unreadCount"), typingIndicator=document.getElementById("typingIndicator"), replyBar=document.getElementById("replyBar"), replyTextEl=document.getElementById("replyText"), chatStatusEl=document.getElementById("chatStatus");

function setUnread(v){unreadCount=v; unreadCountEl.textContent=v>99?"99+":String(v); unreadCountEl.classList.toggle("show",v>0); chatDot.classList.toggle("show",v>0);}

function renderMsg(text,who,name,reply,key,status){
  const d=document.createElement("div"), isAmado=name==="عمادو"||who==="amado"||(who===me&&ACCOUNT_NAME==="amado"); d.className="msg "+(isAmado?"amado":"ekramo"); d.dataset.key=key||""; d.dataset.who=who||"";
  if(reply?.text){const q=document.createElement("span");q.className="msg-reply";q.textContent="رد على "+(reply.name||"")+": "+reply.text;d.appendChild(q);}
  const label=document.createElement("span");label.className="msg-name";label.textContent=name||accountLabel();d.appendChild(label);
  const content=document.createElement("span");
  const parts=String(text||"").split(/(https?:\/\/[^\s]+)/g);
  parts.forEach(part=>{if(/^https?:\/\//i.test(part)){const a=document.createElement("a");a.href=part;a.target="_blank";a.rel="noopener noreferrer";a.textContent=part;a.style.color="#ffd1d1";content.appendChild(a);}else content.appendChild(document.createTextNode(part));});
  d.appendChild(content);

  if(who===me){const st=document.createElement("span");st.className="msg-status";st.dataset.status="1";st.textContent=status||"✓ تم الإرسال";d.appendChild(st);}
  d.addEventListener("click",()=>chooseReply({name:name||accountLabel(),text}));chatBody.appendChild(d);chatBody.scrollTop=chatBody.scrollHeight;
}
function markStatus(key,text){const el=chatBody.querySelector('[data-key="'+key+'"] .msg-status');if(el){el.textContent=text;el.classList.toggle("read",text.includes("قرأت"));}}
function markOpenMessagesRead(){
  if(!connected) return;
  chatBody.querySelectorAll(".msg[data-key]").forEach(el=>{
    if(el.dataset.who && el.dataset.who !== me) roomRef.child("chat/"+el.dataset.key+"/readBy/"+ACCOUNT_NAME).set(true);
  });
}
function updateTyping(){if(!connected)return;roomRef.child("typing/"+ACCOUNT_NAME).set(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>roomRef.child("typing/"+ACCOUNT_NAME).remove(),1200);}
function cancelReply(){replyTo=null;replyBar.classList.remove("show");replyTextEl.textContent="";}
document.getElementById("replyCancel").addEventListener("click",cancelReply);
document.getElementById("muteChatBtn").addEventListener("click",()=>{soundMuted=!soundMuted;localStorage.setItem("ourcinema_mute",soundMuted?"1":"0");document.getElementById("muteChatBtn").textContent=soundMuted?"🔕":"🔔";});
document.getElementById("muteChatBtn").textContent=soundMuted?"🔕":"🔔";
const emojiPicker=document.getElementById("emojiPicker");
[...emojiPicker.textContent].forEach(ch=>{});
const emojiChars=["😊","😂","😍","😘","😢","😡","👍","👏","❤️","🔥","🎉","🙏","😎","🤍","💔","🤣","😉","🤩","😴","🙌","✨","💯","👀","✅","❌"];
emojiPicker.textContent="";
emojiChars.forEach(ch=>{const b=document.createElement("button");b.type="button";b.className="emoji-choice";b.textContent=ch;b.addEventListener("click",()=>{const input=document.getElementById("chatInput");input.value+=ch;input.focus();emojiPicker.classList.remove("open");updateTyping();});emojiPicker.appendChild(b);});
document.getElementById("emojiBtn").addEventListener("click",e=>{e.stopPropagation();emojiPicker.classList.toggle("open");});
document.addEventListener("click",e=>{if(!emojiPicker.contains(e.target)&&e.target.id!=="emojiBtn")emojiPicker.classList.remove("open");});
document.getElementById("clearChatBtn").addEventListener("click",()=>{if(window.confirm("هل تريد مسح كل رسائل المحادثة؟")){if(connected)roomRef.child("chat").remove().catch(err=>alert("تعذر المسح: "+err.message));chatBody.replaceChildren();setUnread(0);}});
if(connected){
  roomRef.child("chat").limitToLast(100).on("child_added",snap=>{const m=snap.val();if(!m)return;const key=snap.key;renderMsg(m.text,m.who,m.name,m.reply,key,m.status);if(m.who!==me){roomRef.child("chat/"+key+"/deliveredTo/"+ACCOUNT_NAME).set(true);if(!chatOpen)setUnread(unreadCount+1);playMessageTone();}else if(m.deliveredTo?.[ACCOUNT_NAME])markStatus(key,"✓✓ تم الوصول");if(chatOpen&&m.who!==me)roomRef.child("chat/"+key+"/readBy/"+ACCOUNT_NAME).set(true);});
  roomRef.child("chat").on("child_changed",snap=>{const m=snap.val()||{}, other=ACCOUNT_NAME==="amado"?"ekramo":"amado";if(m.readBy?.[other])markStatus(snap.key,"✓✓ تمت القراءة");else if(m.deliveredTo?.[other])markStatus(snap.key,"✓✓ تم الوصول");});
  roomRef.child("typing").on("value",snap=>{const t=snap.val()||{},other=t[ACCOUNT_NAME==="amado"?"ekramo":"amado"];typingIndicator.innerHTML=other?"<span class='typing-dots'>•••</span> يكتب الآن":"";});
}
function sendChat(){const input=document.getElementById("chatInput"),text=input.value.trim();if(!text)return;const payload={text,who:me,name:accountLabel(),at:Date.now(),status:"sent"};if(replyTo)payload.reply={name:replyTo.name,text:replyTo.text};if(connected)roomRef.child("chat").push(payload);else renderMsg(text,me,accountLabel(),payload.reply,"local","✓ تم الإرسال");input.value="";cancelReply();if(connected)roomRef.child("typing/"+ACCOUNT_NAME).remove();}
document.getElementById("chatSend").addEventListener("click",sendChat);document.getElementById("chatInput").addEventListener("input",updateTyping);document.getElementById("chatInput").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendChat();}});

</script>
</body>
</html>
